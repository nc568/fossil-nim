name: CI

# Everything the web-backend work claims is checked here, on a clean clone, with
# no Nim and no browser installed by hand. That is the point: D12 was the
# complaint that these tests could not be reproduced outside one machine, so the
# CI job is written to need nothing but `git`, `gcc`, `node` and `npm`.
#
# Every command goes through tools/ci_run.sh, which republishes the tail of a
# failing command's output as an error annotation. Job logs live on blob storage
# that is not reachable from everywhere; annotations are served by the ordinary
# API. Without this a red build says only "exit code 1".

on:
  # Pushes to a branch that has an open pull request already trigger the
  # pull_request event below, so listing the branch here as well would just run
  # the same thing twice.
  push:
    branches:
      - uirelays-web-backends
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # The authoritative gate: the whole suite, plus the stages that need a real
  # browser. ubuntu-latest ships Chrome, so unlike a bare container these
  # stages actually execute -- and the job fails if they quietly skip.
  # --------------------------------------------------------------------------
  suite:
    name: Full suite (ubuntu, real Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Restore a previously built Nim
        uses: actions/cache@v4
        with:
          path: ~/.local/nim-2.2.4
          key: nim-2.2.4-${{ runner.os }}-${{ hashFiles('tools/bootstrap_nim.sh') }}
          restore-keys: nim-2.2.4-${{ runner.os }}-

      # On a cache miss this compiles Nim 2.2.4 from source via csources_v2 +
      # `koch boot`, exactly as the README tells a new contributor to do.
      - name: Bootstrap Nim from source (D12, N8)
        shell: bash
        run: |
          set -euo pipefail
          nim_bin=$(sh tools/bootstrap_nim.sh | tail -n 1)
          echo "bootstrap_nim.sh reported: $nim_bin"
          dirname "$nim_bin" >> "$GITHUB_PATH"
          "$nim_bin" --version | head -1

      - name: Toolchain
        shell: bash
        run: |
          set -uo pipefail
          echo "nim   $(nim --version | head -1)"
          echo "node  $(node --version)"
          echo "npm   $(npm --version)"
          echo "gcc   $(gcc --version | head -1)"
          found=0
          for b in google-chrome google-chrome-stable chromium chromium-browser chrome firefox; do
            if command -v "$b" >/dev/null 2>&1; then
              echo "browser  $b -> $($b --version 2>/dev/null | head -1)"
              found=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::warning::no browser on PATH; the in-browser stages will skip and the gate below will fail"
          fi

      - name: Install jsdom exactly as the lock pins it
        shell: bash
        working-directory: tests/jsdom
        run: npm ci --no-audit --no-fund

      # D1 was "-d:canvas + nim js builds fine and shows a blank page". The
      # regression test asserts on the emitted JS; this asserts the three flag
      # combinations the README documents still compile at all.
      - name: "D1: nim js compiles for -d:canvas and both -d:html int64 modes"
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/uirelays_js"
          mkdir -p "$out"
          sh tools/ci_run.sh "nim js -d:canvas" \
            nim js --mm:arc --path:src --outdir:"$out" -d:canvas examples/todo.nim
          sh tools/ci_run.sh "nim js -d:html (int64 -> BigInt)" \
            nim js --mm:arc --path:src --outdir:"$out" -d:html examples/todo.nim
          sh tools/ci_run.sh "nim js -d:html --jsbigint64:off" \
            nim js --mm:arc --path:src --outdir:"$out" -d:html --jsbigint64:off -d:nimStringHash2 examples/todo.nim
          ls -la "$out"

      - name: Full suite (tester.nim)
        shell: bash
        run: |
          set -uo pipefail
          CI_RUN_LOG=/tmp/suite.log sh tools/ci_run.sh "tester.nim (whole suite)" \
            nim c --mm:arc --outdir:/tmp/uirelays_bins -r tests/tester.nim

      # A skip is only honest when the tool really is missing. On this image it
      # is not, so "no browser installed" here means the test stopped finding
      # Chrome -- which would silently turn 18 real checks into 18 no-ops.
      - name: The in-browser stages really ran
        shell: bash
        run: |
          set -uo pipefail
          if grep -qE "no browser (installed|found)" /tmp/suite.log; then
            echo "::error::the in-browser stages skipped although this image ships Chrome"
            grep -n "SKIP" /tmp/suite.log || true
            exit 1
          fi
          echo "In-browser stages executed. Remaining skips:"
          grep -n "SKIP" /tmp/suite.log || echo "  (none)"

      - name: Per-suite results
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "## Test suites"
            echo
            echo '```'
            grep -E "^Passed: |^ALL PASS|^FAILURE|^  FAIL  " /tmp/suite.log || echo "(no summary lines found)"
            echo '```'
            echo
            echo "Skipped stages: $(grep -c 'SKIP' /tmp/suite.log || true)"
            echo "Failed checks:  $(grep -c '^  FAIL  ' /tmp/suite.log || true)"
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^Passed: " /tmp/suite.log

      # Committing a stale bundle is a mistake this repo has already made once
      # (an example changed, exported_html/ did not). Regenerate and compare.
      - name: exported_html/ matches the committed bundle
        shell: bash
        run: |
          set -euo pipefail
          sh tools/ci_run.sh "regenerate exported_html" \
            nim c --mm:arc --outdir:/tmp/uirelays_bins -r tools/export_interactive_html.nim
          git add -A -f exported_html
          if ! git diff --cached --quiet -- exported_html; then
            echo "::error::exported_html/ is stale -- an example or the exporter changed without regenerating the bundle"
            git diff --cached --stat -- exported_html
            exit 1
          fi
          echo "exported_html/ is up to date."

      - name: Upload the suite log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-log
          path: /tmp/suite.log
          if-no-files-found: warn

  # --------------------------------------------------------------------------
  # The monkey test at one seed is a sample, not a proof. These jobs re-run the
  # same 9 apps at other seeds and with more steps, so a fix that only happens
  # to survive seed 20261019 does not pass.
  # --------------------------------------------------------------------------
  fuzz:
    name: Monkey fuzz (seed ${{ matrix.seed }}, ${{ matrix.steps }} steps)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: suite          # reuses the Nim the suite job cached instead of rebuilding
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 20261026, 777]
        steps: [300]

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Restore the Nim the suite job built
        uses: actions/cache@v4
        with:
          path: ~/.local/nim-2.2.4
          key: nim-2.2.4-${{ runner.os }}-${{ hashFiles('tools/bootstrap_nim.sh') }}
          restore-keys: nim-2.2.4-${{ runner.os }}-

      - name: Put Nim on PATH
        shell: bash
        run: |
          set -euo pipefail
          nim_bin=$(sh tools/bootstrap_nim.sh | tail -n 1)
          dirname "$nim_bin" >> "$GITHUB_PATH"
          nim --version | head -1

      - name: Install jsdom
        shell: bash
        working-directory: tests/jsdom
        run: npm ci --no-audit --no-fund

      - name: Build the standalone bundle
        shell: bash
        run: |
          set -euo pipefail
          sh tools/ci_run.sh "build exported_html" \
            nim c --mm:arc --outdir:"$RUNNER_TEMP/bins" -r tools/export_interactive_html.nim
          ls -la exported_html | head

      - name: Run the monkey harness
        shell: bash
        run: |
          set -uo pipefail
          # CI_RUN_LOG keeps the harness output for the parser below without
          # redirecting ci_run.sh itself -- redirecting it would swallow the
          # error annotation, which is the whole reason the wrapper exists.
          CI_RUN_LOG="$RUNNER_TEMP/raw.log" \
            sh tools/ci_run.sh "monkey harness seed=${{ matrix.seed }} steps=${{ matrix.steps }}" \
              node tests/jsdom/monkey_harness.js exported_html/uirelays_all_apps.html \
                --steps=${{ matrix.steps }} --seed=${{ matrix.seed }} --json --quiet
          code=$?
          # The harness prints its JSON report last; anything before the first
          # brace is progress output and must not break the parse.
          python3 - "$RUNNER_TEMP/raw.log" "$RUNNER_TEMP/report.json" <<'PY'
          import json, sys
          raw = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          i = raw.find('{')
          if i < 0:
              print("no JSON in the harness output:\n" + raw[:4000])
              sys.exit(1)
          json.dump(json.loads(raw[i:]), open(sys.argv[2], 'w'), indent=2)
          PY
          if [ "$code" -ne 0 ]; then
            echo "::error::monkey harness failed at seed ${{ matrix.seed }}"
            tail -40 "$RUNNER_TEMP/raw.log"
          fi
          exit "$code"

      - name: Report
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          [ -f "$RUNNER_TEMP/report.json" ] || { echo "no report"; exit 0; }
          python3 - "$RUNNER_TEMP/report.json" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          r = json.load(open(sys.argv[1], encoding='utf-8'))
          t = r.get('reconcileTotals', {}) or {}
          print("## Monkey fuzz -- seed %s, %s steps/app\n" % (r.get('seed'), r.get('stepsPerApp')))
          print("| metric | value |")
          print("|---|---|")
          print("| ok | **%s** |" % r.get('ok'))
          print("| apps | %s |" % len(r.get('apps', [])))
          print("| JS errors | %s |" % len(r.get('errors', [])))
          print("| bad styles (NaN) | %s |" % r.get('badStyles'))
          print("| innerHTML writes | %s |" % t.get('innerHtmlWrites'))
          print("| identity breaks | %s |" % t.get('identityBreaks'))
          print("| node count mismatches | %s of %s |" % (
              t.get('nodeCountMismatches'), t.get('nodeCountSamples')))
          print("| worst churn vs rewrite | %s |" % t.get('worstChurnVsRewrite'))
          print("| maxTextOverflowPx | %s |" % r.get('maxTextOverflowPx'))
          print("| text clicks | %s |" % r.get('textClicks'))
          print("| clipboard writes | %s |" % r.get('clipboardWrites'))
          errs = r.get('errors', [])
          if errs:
              print("\nFirst errors:\n")
              for e in errs[:10]:
                  print("- `%s`" % e)
          PY

      - name: Upload the fuzz report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monkey-report-seed-${{ matrix.seed }}
          path: |
            ${{ runner.temp }}/report.json
            ${{ runner.temp }}/raw.log
          if-no-files-found: warn

  # --------------------------------------------------------------------------
  # The web work touched shared code -- the {.uirApp.} macro, the Event type,
  # screen.nim -- so the native backends have to keep compiling too. These are
  # the two OSes whose native driver CI never looks at otherwise.
  # --------------------------------------------------------------------------
  portability:
    name: Native + web backends on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.4'

      - name: Environment
        shell: bash
        run: |
          set -uo pipefail
          echo "os           ${{ matrix.os }}"
          echo "nim          $(nim --version | head -1)"
          echo "RUNNER_TEMP  $RUNNER_TEMP"
          echo "bash         $BASH_VERSION"
          uname -a || true

      - name: Driver-free tests
        shell: bash
        run: |
          set -euo pipefail
          for t in tinyniftest layouttest inputtest; do
            sh tools/ci_run.sh "tests/$t.nim" \
              nim c --mm:arc --outdir:"$RUNNER_TEMP/bins" -r "tests/$t.nim"
          done

      # Split per backend and per defect set: "the web tests fail on Windows"
      # is not a diagnosis, "web_html_test -d:html fails on Windows" is.
      - name: Web backend tests (-d:html)
        shell: bash
        run: |
          set -euo pipefail
          sh tools/ci_run.sh "web_html_test -d:html" \
            nim c --mm:arc -d:html --outdir:"$RUNNER_TEMP/bins" -r tests/web_html_test.nim

      - name: Web backend tests (-d:canvas)
        shell: bash
        run: |
          set -euo pipefail
          sh tools/ci_run.sh "web_canvas_test -d:canvas" \
            nim c --mm:arc -d:canvas --outdir:"$RUNNER_TEMP/bins" -r tests/web_canvas_test.nim

      - name: One check per fixed defect (-d:html)
        shell: bash
        run: |
          set -euo pipefail
          sh tools/ci_run.sh "web_backend_regression_test -d:html" \
            nim c --mm:arc -d:html --outdir:"$RUNNER_TEMP/bins" -r tests/web_backend_regression_test.nim

      - name: One check per fixed defect (-d:canvas)
        shell: bash
        run: |
          set -euo pipefail
          sh tools/ci_run.sh "web_backend_regression_test -d:canvas" \
            nim c --mm:arc -d:canvas --outdir:"$RUNNER_TEMP/bins" -r tests/web_backend_regression_test.nim

      - name: Every example compiles for this OS's native backend
        shell: bash
        run: |
          set -euo pipefail
          for f in examples/*.nim; do
            sh tools/ci_run.sh "native compile $f" \
              nim c --mm:arc --outdir:"$RUNNER_TEMP/bins" "$f"
          done

      - name: And for both web backends
        shell: bash
        run: |
          set -euo pipefail
          for f in examples/*.nim; do
            sh tools/ci_run.sh "-d:html compile $f" \
              nim c --mm:arc -d:html --outdir:"$RUNNER_TEMP/bins" "$f"
            sh tools/ci_run.sh "-d:canvas compile $f" \
              nim c --mm:arc -d:canvas --outdir:"$RUNNER_TEMP/bins" "$f"
          done
