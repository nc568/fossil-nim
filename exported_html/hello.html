<title>Hello uirelays — UIRelays Pure HTML5 + CSS3 (No JS · No Canvas · No WASM)</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #11111b;
    color: #cdd6f4;
    font-family: ui-monospace, "JetBrains Mono", "Fira Code", "Cascadia Mono", monospace;
  }
  .hdr {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 18px;
    background: #181825;
    border-bottom: 1px solid #313244;
    font-size: 12px;
  }
  .badge {
    background: #a6e3a1;
    color: #11111b;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11px;
  }
  .meta { color: #a6adc8; }
  .stage-wrap {
    display: flex;
    justify-content: center;
    padding: 20px;
    overflow: auto;
  }
  .uir-viewport {
    position: relative;
    overflow: hidden;
    background: #1e1e2e;
    border: 1px solid #45475a;
    border-radius: 6px;
    box-shadow: 0 14px 36px rgba(0,0,0,0.55);
    width: 640px;
    height: 480px;
    flex-shrink: 0;
  }
  .uir-rect, .uir-point, .uir-line-h, .uir-line-v, .uir-svg-line, .uir-text, .uir-img-crop, .uir-blit {
    position: absolute;
    pointer-events: none;
  }
  .uir-text {
    white-space: pre;
    line-height: 1;
    font-family: ui-monospace, "JetBrains Mono", "Fira Code", "Cascadia Mono", monospace;
  }
  .uir-clip {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
</style>
</head>
