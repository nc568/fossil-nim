<style>*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #11111b;
  color: #cdd6f4;
  font-family: ui-monospace, "JetBrains Mono", "Fira Code", "Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace;

#uir-shell {
  display: flex;
  flex-direction: column;
  width: 100vw;
  height: 100vh;
}
#uir-hud {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 12px;
  background: #181825;
  border-bottom: 1px solid #313244;
  font-size: 12px;
  flex-shrink: 0;
  flex-wrap: wrap;
}
.uir-hud-group {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.uir-badge {
  padding: 2px 7px;
  border-radius: 4px;
  font-weight: 600;
  background: #313244;
  color: #89b4fa;
  border: 1px solid #45475a;
  font-size: 11px;
}
.uir-badge.ok {
  background: rgba(166, 227, 161, 0.14);
  color: #a6e3a1;
  border-color: rgba(166, 227, 161, 0.4);
}
.uir-btn, .app-tab {
  background: #313244;
  color: #cdd6f4;
  border: 1px solid #45475a;
  border-radius: 5px;
  padding: 4px 9px;
  font-size: 11px;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.12s ease;
}
.uir-btn:hover, .app-tab:hover {
  background: #45475a;
  border-color: #89b4fa;
}
.app-tab.active {
  background: #89b4fa;
  color: #11111b;
  border-color: #89b4fa;
  font-weight: 700;
}
.uir-input {
  background: #1e1e2e;
  color: #cdd6f4;
  border: 1px solid #45475a;
  border-radius: 4px;
  padding: 2px 6px;
  font-size: 11px;
  font-family: inherit;
  width: 130px;
}
#uir-desc-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 4px 12px;
  background: #141421;
  border-bottom: 1px solid #26273a;
  font-size: 11px;
  color: #a6adc8;
  flex-shrink: 0;
}
#uir-stage {
  position: relative;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: radial-gradient(circle at center, #1e1e2e 0%, #11111b 100%);
  padding: 2px;
}
#uir-viewport {
  position: relative;
  overflow: hidden;
  background: #1e1e2e;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55), 0 0 0 1px #313244;
  outline: none;
  contain: layout style paint;
}
.uir-rect, .uir-point, .uir-line-h, .uir-line-v, .uir-svg-line, .uir-text, .uir-img-crop, .uir-blit-clip, .uir-clip {
  position: absolute;
  pointer-events: none;
}
.uir-text {
  white-space: pre;
  line-height: 1;
  font-variant-ligatures: none;
}
.uir-clip {
  overflow: hidden;
}
.uir-img, .uir-blit {
  image-rendering: pixelated;
}
</style>
