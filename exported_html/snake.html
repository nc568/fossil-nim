  font-size: 11px;
  font-family: inherit;
  width: 130px;
}

  align-items: center;
  justify-content: space-between;

  color: #a6adc8;
  flex-shrink: 0;

  position: relative;
  flex: 1;
  display: flex;
  align-items: center;
